spring.application.name=demo
spring.datasource.url=jdbc:mysql://localhost:3306/leema?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Run data.sql AFTER Hibernate creates/updates the schema
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
jwt.secret=ThisIsAVeryLongSecretKeyForJwtAuthenticationThatIsSecure123456
jwt.expiration=604800000

# ===== PayHere (Sri Lanka) sandbox =====
# Get these from https://sandbox.payhere.lk after creating a merchant account.
# notify.url must be publicly reachable for the PayHere callback (use ngrok in dev).
payhere.sandbox=true
payhere.merchant-id=1230000
payhere.merchant-secret=REPLACE_WITH_YOUR_PAYHERE_MERCHANT_SECRET
payhere.return-url=http://localhost:5173/payment/success
payhere.cancel-url=http://localhost:5173/payment/cancel
payhere.notify-url=http://localhost:8080/api/payments/payhere/notify

